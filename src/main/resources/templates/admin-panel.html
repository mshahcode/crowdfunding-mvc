<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation - Crowdfunding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">

    <style>
        table th, td {
            text-align: center;
        }

        .btn {
            background-color: #32AA27;
            color: white;
            font-weight: bold;
            padding: 10px 30px;
            transition: all 0.5s ease;
            border-radius: 0;
        }

        .btn:hover {
            color: white;
            transform: scale(1.01);
            background-color: #2e5637;
        }

    </style>
</head>
<body>

<div class="d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light sticky-top">
        <div class="container">
            <h3>Admin Panel</h3>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/v1/ideas}">Discover Ideas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/v1/ideas/manage}">Manage Ideas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Log Out</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid flex-grow-1">
        <div class="row">
            <!-- Main Content -->
            <div class="col-md-12">
                <div class="row mt-4">
                    <!-- Statistics Widgets -->
                    <div class="col-md-4">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">Total Users</h5>
                                <p class="card-text" th:text="${totalUsersCount}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">Active Users</h5>
                                <p class="card-text" th:text="${totalActiveUsersCount}"></p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-warning mb-3">
                            <div class="card-body text-center">
                                <h5 class="card-title">Completed Projects</h5>
                                <p class="card-text" th:text="${totalCompletedIdeasCount}"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- User Table -->
                <div class="card mt-4">
                    <div class="card-header">
                        User Management
                    </div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th>Active</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${usersDto}">
                                <td th:text="${user.id}"></td>
                                <td th:text="${user.nickname}"></td>
                                <td th:text="${user.email}"></td>
                                <td th:text="${user.roles}"></td>
                                <td th:text="${user.isActive}"></td>
                                <td>
                                    <form style="display:inline;" th:action="@{/v1/users/promote/{id}(id=${user.id})}"
                                          method="post">
                                        <input type="hidden" value="ADMIN" name="role" id="role">
                                        <button class="btn btn-sm">Promote</button>
                                    </form>
                                    <form style="display:inline;" th:action="@{/v1/users/delete/{id}(id=${user.id})}"
                                          method="post">
                                        <button class="btn btn-sm">Delete</button>
                                    </form>
                                    <form style="display:inline;" th:if="${user.isActive != true}"
                                          th:action="@{/v1/users/activate/{id}(id=${user.id})}" method="post">
                                        <button class="btn btn-sm">Activate</button>
                                    </form>
                                    <form style="display:inline;" th:if="${user.isActive == true}"
                                          th:action="@{/v1/users/deactivate/{id}(id=${user.id})}" method="post">
                                        <button class="btn btn-sm">Deactivate</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Report Request Section -->
                <div class="row mt-4">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                Request a Report
                            </div>
                            <div class="card-body">
                                <form th:action="@{/v1/reports/generate}" method="post">
                                    <div class="mb-3">
                                        <label for="reportType" class="form-label">Report Type</label>
                                        <select class="form-select" id="reportType" name="reportType" required>
                                            <option value="USERS_INFO">Users Data</option>
                                            <option value="IDEAS_INFO">Ideas Data</option>
                                            <option value="DONATIONS_INFO">Donations Data</option>
                                        </select>
                                    </div>
                                    <button style="background-color: #161616;" type="submit" class="btn btn-sm">Send
                                        Request
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header">
                                Reported Requests
                            </div>
                            <div class="card-body">
                                <table class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>File Name</th>
                                        <th>Type</th>
                                        <th>Status</th>
                                        <th>Created At</th>
                                        <th>Actions</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="report : ${reports}">
                                        <td th:text="${report.id}"></td>
                                        <td th:text="${report.fileName}"></td>
                                        <td th:text="${report.type}"></td>
                                        <td th:text="${report.status}"></td>
                                        <td th:text="${#dates.format(report.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td>
                                            <a th:if="${report.status.name() != 'ERROR' && report.status.name() != 'IN_PROGRESS'}"
                                               th:href="@{'/v1/reports/' + ${report.id} + '/download'}"
                                               class="btn btn-sm">Download</a>
                                        </td>
                                        <td>
                                            <form th:if="${report.status.name() != 'IN_PROGRESS'}"
                                                  th:action="@{'/v1/reports/' + ${report.id} + '/delete'}"
                                                  method="post">
                                                <button class="btn btn-sm">Delete</button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center mt-3">
        <div class="container">
            <div class="row">
                <div class="col">
                    <p>&copy; 2024 Crowdfunding Project</p>
                </div>
            </div>
        </div>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
