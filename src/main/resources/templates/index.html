<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org" lang="en"
        xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover - Crowdfunding</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
    <link href="/css/index.css" rel="stylesheet">

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" th:href="@{/v1/ideas}">Welcome <span th:text="${activeUser.nickname}"></span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/v1/admin/panel}">Admin Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/v1/ideas}">Discover Ideas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/v1/ideas/manage}">Manage Ideas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Log Out</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Main Section -->
<div class="container-fluid mt-5" id="ideasMainSection">
    <div class="row">
        <div class="col-12 mb-3 text-center">
            <h3 style="font-weight: bold">Discover Ideas!</h3>
        </div>
    </div>
    <div class="row">
        <!-- Sidebar: Filters -->
        <div class="col-md-3 mh-100" id="filterSideBar">
            <form method="get" th:action="@{/v1/ideas}" class="p-4 rounded mt-3">
                <h4>Filter Ideas</h4>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" th:value="${filter.name}" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" name="category" class="form-select">
                        <option value="" th:selected="${filter.category == null}">All Categories</option>
                        <option value="Tech" th:selected="${filter.category == 'Tech'}">Tech</option>
                        <option value="Health" th:selected="${filter.category == 'Health'}">Health</option>
                        <option value="Education" th:selected="${filter.category == 'Education'}">Education</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="" th:selected="${filter.status == null}">All Statuses</option>
                        <option value="IN_PROGRESS" th:selected="${filter.status == 'IN_PROGRESS'}">In Progress</option>
                        <option value="COMPLETED" th:selected="${filter.status == 'COMPLETED'}">Completed</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sortBy" class="form-label">Sort By</label>
                    <select id="sortBy" name="sortBy" class="form-select">
                        <option value="name" th:selected="${filter.sortBy == 'name'}">Name</option>
                        <option value="goalAmount" th:selected="${filter.sortBy == 'goalAmount'}">Goal Amount</option>
                        <option value="currentAmount" th:selected="${filter.sortBy == 'currentAmount'}">Current Amount
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sortOrder" class="form-label">Sort Order</label>
                    <select id="sortOrder" name="sortOrder" class="form-select">
                        <option value="asc" th:selected="${filter.sortOrder == 'asc'}">Ascending</option>
                        <option value="desc" th:selected="${filter.sortOrder == 'desc'}">Descending</option>
                    </select>
                </div>
                <div class="row d-flex gap-1">
                    <div class="col">
                        <button type="submit" class="btn">Filter</button>
                    </div>
                    <div class="col">
                        <a class="btn" th:href="@{/v1/ideas}">Reset</a>
                    </div>
                </div>

            </form>
        </div>

        <!-- Main Content: Idea Cards -->
        <div class="col-md-9">
            <div class="row">
                <div class="col-md-4 mb-4" th:each="ideaCard : ${ideaCards}">
                    <div class="card p-2 idea-card"
                         style="cursor: pointer;"
                         th:data-url="@{/v1/ideas/{id}(id=${ideaCard.id})}">
                        <img class="card-img-top" alt="Idea Image"
                             th:src="${ideaCard.imageUrl != null ? '/images/ideas/' + ideaCard.imageUrl : 'https://static.vecteezy.com/system/resources/thumbnails/022/059/000/small_2x/no-image-available-icon-vector.jpg'}">
                        <div class="card-body text-center">
                            <h5 class="card-title" th:text="${ideaCard.name}">Idea Name</h5>
                            <p class="card-text">
                                Goal: <span th:text="${ideaCard.goalAmount}">0.00</span><br>
                                Raised: <span th:text="${ideaCard.currentAmount}">0.00</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <div class="row">
            <div class="col">
                <p>&copy; 2024 Crowdfunding Project</p>
            </div>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
