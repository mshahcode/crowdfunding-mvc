<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdfunding Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global.css" rel="stylesheet">
</head>
<body>
<!-- Filter Form -->
<div class="container-fluid mt-5">
    <div class="row">
        <!-- Sidebar: Filters -->
        <div class="col-md-3">
            <form method="get" th:action="@{/v1/ideas}" class="bg-light p-4 rounded">
                <h4>Filter Ideas</h4>
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name" th:value="${filter.name}" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select id="category" name="category" class="form-select">
                        <option value="" th:selected="${filter.category == null}">All Categories</option>
                        <option value="Tech" th:selected="${filter.category == 'Tech'}">Tech</option>
                        <option value="Health" th:selected="${filter.category == 'Health'}">Health</option>
                        <option value="Education" th:selected="${filter.category == 'Education'}">Education</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" name="status" class="form-select">
                        <option value="" th:selected="${filter.status == null}">All Statuses</option>
                        <option value="IN_PROGRESS" th:selected="${filter.status == 'IN_PROGRESS'}">In Progress</option>
                        <option value="COMPLETED" th:selected="${filter.status == 'COMPLETED'}">Completed</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sortBy" class="form-label">Sort By</label>
                    <select id="sortBy" name="sortBy" class="form-select">
                        <option value="name" th:selected="${filter.sortBy == 'name'}">Name</option>
                        <option value="goalAmount" th:selected="${filter.sortBy == 'goalAmount'}">Goal Amount</option>
                        <option value="currentAmount" th:selected="${filter.sortBy == 'currentAmount'}">Current Amount</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="sortOrder" class="form-label">Sort Order</label>
                    <select id="sortOrder" name="sortOrder" class="form-select">
                        <option value="asc" th:selected="${filter.sortOrder == 'asc'}">Ascending</option>
                        <option value="desc" th:selected="${filter.sortOrder == 'desc'}">Descending</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Filter</button>
            </form>
        </div>

        <!-- Main Content: Idea Cards -->
        <div class="col-md-9">
            <div class="row">
                <div class="col-md-4 mb-4" th:each="ideaCard : ${ideaCards}">
                    <div class="card">
                        <img th:src="${ideaCard.imageUrl}" class="card-img-top" alt="Idea Image">
                        <div class="card-body text-center">
                            <h5 class="card-title" th:text="${ideaCard.name}">Idea Name</h5>
                            <p class="card-text">
                                Goal: <span th:text="${ideaCard.goalAmount}">0.00</span><br>
                                Raised: <span th:text="${ideaCard.currentAmount}">0.00</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
