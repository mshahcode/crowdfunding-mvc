<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation - Crowdfunding</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="/css/global.css" rel="stylesheet">
    <link href="/css/donation-form.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/v1/admin/panel}">Admin Panel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/v1/ideas}">Discover Ideas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/v1/ideas/manage}">Manage Ideas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Log Out</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section id="donation-section" class="d-flex flex-column align-items-center justify-content-center">
    <div class="container">
        <div class="row">
            <div class="col-md-6 d-flex flex-column align-items-center">
                <h4>Fund an Idea</h4>
                <form id="donationForm" class="mt-4" th:action="@{/v1/donations/ideas/{id}(id=${ideaDto.id})}"
                      method="post" th:object="${donationForm}">
                    <div class="row mb-3">
                        <div class="col">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" th:field="*{amount}" class="form-control" id="amount"
                                   placeholder="Enter donation amount" step="0.01">
                            <div th:if="${#fields.hasErrors('amount')}">
                                <ul>
                                    <li style="text-decoration: none;" th:each="err : ${#fields.errors('amount')}"
                                        th:text="${err}"></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="message" class="form-label">Message</label>
                            <textarea th:field="*{message}" class="form-control" id="message"
                                      placeholder="Leave a message"></textarea>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="cardType" class="form-label">Card Type</label>
                            <select id="cardType" name="cardType" class="form-select">
                                <option value="CREDIT">CREDIT</option>
                                <option value="DEBIT" th:selected="${donationForm.cardType == 'DEBIT'}">DEBIT</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="cardNumber" class="form-label">Card Number</label>
                            <input th:field="*{cardNumber}" class="form-control" id="cardNumber"
                                   placeholder="1234567891011121">
                            <div th:if="${#fields.hasErrors('cardNumber')}">
                                <ul>
                                    <li style="text-decoration: none" th:each="err : ${#fields.errors('cardNumber')}"
                                        th:text="${err}"></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="cardCvv" class="form-label">Card CVV</label>
                            <input th:field="*{cardCvv}" class="form-control" id="cardCvv"
                                   placeholder="123">
                            <div th:if="${#fields.hasErrors('cardCvv')}">
                                <ul>
                                    <li style="text-decoration: none" th:each="err : ${#fields.errors('cardCvv')}"
                                        th:text="${err}"></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col">
                            <label for="cardExpDate" class="form-label">Card Expiration</label>
                            <input th:type="month" th:field="*{cardExpDate}" class="form-control"
                                   id="cardExpDate">
                            <div th:if="${#fields.hasErrors('cardExpDate')}">
                                <ul>
                                    <li style="text-decoration: none" th:each="err : ${#fields.errors('cardExpDate')}"
                                        th:text="${err}"></li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col text-center">
                            <button id="donate-button" type="submit" class="btn">Donate</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-md-6 d-flex flex-column text-center p-5"
                 id="donationRightSide">
                <img class="card-img-top" alt="Idea Image"
                     th:src="${ideaDto.imageUrl != null ? '/images/ideas/' + ideaDto.imageUrl : 'https://static.vecteezy.com/system/resources/thumbnails/022/059/000/small_2x/no-image-available-icon-vector.jpg'}">

                <div class="d-flex flex-column justify-content-center align-items-center text-center p-5">
                    <table class="table mt-4">
                        <tbody>
                        <tr>
                            <td>Goal Amount</td>
                            <td th:text="${ideaDto.goalAmount}">Goal Amount</td>
                        </tr>
                        <tr>
                            <td>Current Amount</td>
                            <td th:text="${ideaDto.currentAmount}">Current Amount</td>
                        </tr>
                        <tr>
                            <td>Remaining Amount</td>
                            <td th:text="${#numbers.formatDecimal(ideaDto.goalAmount - ideaDto.currentAmount, 1, 2)}">
                                Remaining Amount
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <div class="row">
            <div class="col">
                <p>&copy; 2024 Crowdfunding Project</p>
            </div>
        </div>
    </div>
</footer>

<script src="/js/validation.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
