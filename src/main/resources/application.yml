server:
  port: 8080

spring:
  application:
    name: crowdfunding
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/crowdfunding-db?serverTimezone=UTC
    username: root
    password: mika
  data:
    jdbc:
      dialect: mysql
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

idea:
  upload:
    dir: src/main/resources/static/images/ideas